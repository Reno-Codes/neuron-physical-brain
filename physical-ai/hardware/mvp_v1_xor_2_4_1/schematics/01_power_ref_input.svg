  <text x="40" y="120" font-family="Consolas, Menlo, monospace" font-size="11">J_PWR: +15 V, GND, -15 V</text>
  <text x="40" y="136" font-family="Consolas, Menlo, monospace" font-size="11">C_VDD_BULK 10uF &gt;=35 V +15 to GND</text>
